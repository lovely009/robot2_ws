# Gazebo 仿真名义值，不代表 UR、RP 或 Vaxor 真机规格与安全标定。
motor_simulation:
  timing: {control_hz: 100, rp_feedback_hz: 100, vaxor_feedback_hz: 50, command_timeout_ms: 150}
  buses: [arm]
  profiles:
    rp_full:
      {hard_lower_deg: -360, hard_upper_deg: 360, command_lower_deg: -355, command_upper_deg: 355,
       velocity_rad_s: 3.141592653589793, effort_nm: 11, gear_ratio: 101, efficiency: 1,
       plant: {kp: 30, kd: 1, torque_constant_nm_per_a: 0.077, current_limit_a: 3.2}}
    rp_elbow:
      {hard_lower_deg: -180, hard_upper_deg: 180, command_lower_deg: -175, command_upper_deg: 175,
       velocity_rad_s: 3.141592653589793, effort_nm: 11, gear_ratio: 101, efficiency: 1,
       plant: {kp: 30, kd: 1, torque_constant_nm_per_a: 0.077, current_limit_a: 3.2}}
    vaxor_wrist:
      {hard_lower_deg: -360, hard_upper_deg: 360, command_lower_deg: -355, command_upper_deg: 355,
       velocity_rad_s: 3.141592653589793, effort_nm: 10, gear_ratio: 80, efficiency: 0.8,
       plant: {kp: 30, kd: 1, torque_constant_nm_per_a: 0.012, current_limit_a: 11}}
  motors:
    - {joint: shoulder_pan_joint, bus: arm, protocol: cerb, id: 1, profile: rp_full}
    - {joint: shoulder_lift_joint, bus: arm, protocol: cerb, id: 2, profile: rp_full}
    - {joint: elbow_joint, bus: arm, protocol: cerb, id: 3, profile: rp_elbow}
    - {joint: wrist_1_joint, bus: arm, protocol: vaxor, id: 4, profile: vaxor_wrist}
    - {joint: wrist_2_joint, bus: arm, protocol: vaxor, id: 5, profile: vaxor_wrist}
    - {joint: wrist_3_joint, bus: arm, protocol: vaxor, id: 6, profile: vaxor_wrist}
