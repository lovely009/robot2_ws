; DM-MC-Board02 / STM32H723VGT6
; Arduino + STM32FreeRTOS + micro-ROS Humble，USB CDC 通信
; 时钟：HSE 24 MHz，SYSCLK 480 MHz，HCLK 240 MHz，PCLKx 120 MHz
; FDCAN：PLL2Q 80 MHz；USB：HSI48 + CRS，以 USB1 SOF 同步

[env:stm32h723vgt6]
; 锁定 STM32 平台版本
platform = ststm32@20.0.0
board = stm32h723vgt6
framework = arduino

; 工程链接脚本
board_build.ldscript = ldscript/stm32h723vgt6.ld

; 预期主频，实际时钟由 system_clock.cpp 的 VerifyCoreClocks() 校验
board_build.f_cpu = 480000000L

; micro-ROS 发行版与传输方式
board_microros_distro = humble
board_microros_transport = serial

; 库级资源配置（JSON，不支持注释），不能用 build_flags 覆盖
; 修改后需重建 micro-ROS 库，优先使用 ../micro_ros_agent/tools/refresh_microros_messages.py
; 发布者/订阅者/服务端上限：12/6/5；流历史深度：16，每个方向 8 KB
; 单段轨迹上限为 256 点，超出需分段发送
board_microros_user_meta = microros_user.meta

; 隔离主机 ROS 环境并检查库配置
extra_scripts =
    pre:tools/isolate_ros_environment.py
    pre:tools/check_microros_config.py

build_flags =
    ; 优化体积；修改后需清理重建并复测实时任务耗时与抖动
    -Os

    ; USB OTG_HS 使用内部 FS PHY（PA11/PA12），启用 CDC
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DPIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE

    ; 启用 FDCAN 和独立看门狗；OSPI 由板级配置启用
    -DHAL_FDCAN_MODULE_ENABLED
    -DHAL_IWDG_MODULE_ENABLED

    ; FreeRTOS 静态内存分配
    -DconfigSUPPORT_STATIC_ALLOCATION=1

    ; 板载外部晶振频率
    -DHSE_VALUE=24000000U

    ; 运行时时钟校验值
    -DDM_MC_EXPECTED_SYSCLK_HZ=480000000U
    -DDM_MC_EXPECTED_HSE_HZ=24000000U

; ST-Link 烧录
upload_protocol = stlink

; 串口监视器默认波特率，不影响 USB CDC 传输
monitor_speed = 115200

; 依赖锁定到指定提交；升级后需重新验证
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
    https://github.com/stm32duino/STM32FreeRTOS.git#3326261b5f3cf6a5b24d4b3fac4551761db721d9

; extra_packages/ 自动引入自定义消息，符号链接指向 ../micro_ros_agent/src/can_bridge_msgs
