motor_simulation:
  timing:
    control_hz: 100
    vaxor_feedback_hz: 50
    command_timeout_ms: 150
  command_margin_deg: 5.0
  buses:
    - {name: arm, transport: socket_can, endpoint: robot_vcan0}
  profiles:
    vaxor_axis:
      hard_lower_deg: -90
      hard_upper_deg: 90
      velocity_rad_s: 2.0
      effort_nm: 10.0
      gear_ratio: 80.0
      efficiency: 0.8
      plant: {kp: 30.0, kd: 1.0, torque_constant_nm_per_a: 0.012, current_limit_a: 11.0}
  motors:
    - {joint: joint_a, bus: arm, protocol: vaxor, id: 1, profile: vaxor_axis}
    - {joint: joint_b, bus: arm, protocol: vaxor, id: 4, profile: vaxor_axis}
