# 电机型号参数库：协议运行所需的最小静态参数 + 软件侧安全保护阈值（与拓扑无关，可跨机器人复用）。
#
# parameters 分三类：
#   - 运行消费：协议策略读取并参与换算（扭矩常数/减速比/效率）。
#   - 协议规格：量程、分辨率、物理换算系数与厂家建议初值；声明不自动改变运行控制逻辑。
#   - 安全阈值：软件侧在 MIT 反馈帧里能实际监控到的量，供保护逻辑消费
#     （扭矩/电流/电压超限）。反馈帧里没有的量（如 vaxor/cerb 无温度）
#     不在此列——写了软件侧也监控不到。
# 其余规格声明（尺寸、重量、外观、轴承等）见 src/motor_drive/docs/ 下规格书。
#
# 结构：
#   motor_types.<型号>.protocol   —— 所属协议类型（决定用哪个 MotorProtocol）；
#                                   缺省时型号名即协议类型。
#   motor_types.<型号>.parameters —— 上述三类参数，单电机可在拓扑覆盖。
#   控制增益 kp/kd 是动态参数，在 motor_driver.yaml 的 motors.<名>.command 配置。
#
# 分工：
#   - 本文件（motor.yaml）       —— 型号库：静态参数 + 安全阈值
#   - motor_driver.yaml（拓扑）  —— 拓扑与动态参数：buses / motors / timing / command
#
# 来源：src/motor_drive/docs/cerb-series.md、motor-2530-series.md 及对应规格书。

motor_types:
  # ── VAXOR 25mm 微型关节模组（反馈为电流 A + 电压 + fault，无温度）──
  # 同一 vaxor 协议下的两个减速比档位；扭矩阈值为关节侧（装减速器后）。
  vaxor_2550:
    protocol: vaxor
    parameters:
      # MIT 增益为协议刻度，物理模型输出电流；位置/速度输入为电机侧 rad、rad/s。
      mit_kp_raw_bits: 16
      mit_kd_raw_bits: 16
      mit_kp_limit: 0.65535             # 65535 × 0.00001，协议刻度上限
      mit_kd_limit: 655.35              # 65535 × 0.01，协议刻度上限
      mit_kp_resolution: 0.00001        # 协议 Kp/LSB；raw = data6 | (data7 << 8)
      mit_kd_resolution: 0.01           # 协议 Kd/LSB；raw = data8 | (data9 << 8)
      mit_kp_from_current_gain_scale: 0.001115  # Kp = kact × 本系数，kact 单位 A/rad
      mit_kd_from_current_gain_scale: 85.636    # Kd = kact × 本系数，kact 单位 A·s/rad
      mit_kp_recommended_initial: 0.008 # 厂家建议初值；实际增益由拓扑 command 指定
      mit_kd_recommended_initial: 1.0
      # —— 运行消费 ——
      torque_constant_nm_per_amp: 0.042    # Kt：反馈电流 → 电机轴 Nm
      gear_ratio: 50                       # 电机↔关节换算
      gear_efficiency: 0.65                # effort × 效率（50 档最大效率）
      # 连续堵转扭矩（绕组 145 ℃），**关节侧**；规格书 motor-2530-series.md 的表
      # 「装减速器后 · 减速比 50」= 1150 mNm。软件侧无消费者，供被控对象取额定值。
      rated_torque_nm: 1.15
      # 额定转速，**关节侧**。参数页给的是电机端「额定 ≤2000 rpm」，除速比 50
      # ⇒ 40 rpm。被控对象的速度上限用它（见模型 tools/build_mujoco_model.py）。
      rated_speed_rad_s: 4.189             # = 2000/50 rpm

  vaxor_2530:
    protocol: vaxor
    parameters:
      # MIT 增益为协议刻度，物理模型输出电流；位置/速度输入为电机侧 rad、rad/s。
      mit_kp_raw_bits: 16
      mit_kd_raw_bits: 16
      mit_kp_limit: 0.65535             # 65535 × 0.00001，协议刻度上限
      mit_kd_limit: 655.35              # 65535 × 0.01，协议刻度上限
      mit_kp_resolution: 0.00001        # 协议 Kp/LSB；raw = data6 | (data7 << 8)
      mit_kd_resolution: 0.01           # 协议 Kd/LSB；raw = data8 | (data9 << 8)
      mit_kp_from_current_gain_scale: 0.001115  # Kp = kact × 本系数，kact 单位 A/rad
      mit_kd_from_current_gain_scale: 85.636    # Kd = kact × 本系数，kact 单位 A·s/rad
      mit_kp_recommended_initial: 0.008 # 厂家建议初值；实际增益由拓扑 command 指定
      mit_kd_recommended_initial: 1.0
      # —— 运行消费 ——
      torque_constant_nm_per_amp: 0.042
      gear_ratio: 30
      gear_efficiency: 0.70                # 30 档最大效率
      rated_speed_rad_s: 6.981             # = 2000/30 rpm，关节侧

  # ── 巨蟹 CERB Lite CAN FD 关节模组（自定义 PDO / MIT）──
  # 缩放依据：ros2_ws/CANFD_MIT快控档位与缩放使用指南.md。
  # 当前值须逐节点读回 0x2542~0x2546；设备值优先，量程变化后分辨率须同步重算。
  # 量化范围不替代下方物理扭矩、电流保护阈值。
  cerb_r58_101:
    protocol: cerb
    parameters:
      # Kt = 0.067 N·m/A（电机侧），减速器效率 75%。
      mit_position_limit_rad: 3.14
      mit_velocity_limit_rad_s: 3.14
      mit_torque_limit_nm: 300.0
      mit_kp_raw_bits: 12
      mit_kd_raw_bits: 12
      mit_kp_limit: 2500.0             # Nm/rad；0x2544 的默认满量程
      mit_kd_limit: 500.0              # Nm·s/rad；0x2545 的默认满量程
      mit_kp_resolution: 0.6105006105006106  # Nm/rad/LSB，2500/4095
      mit_kd_resolution: 0.1221001221001221  # Nm·s/rad/LSB，500/4095
      torque_constant_nm_per_amp: 0.067
      gear_ratio: 101
      gear_efficiency: 0.75
      rated_torque_nm: 20.0
      peak_torque_nm: 45.0
      rated_current_amp: 3.5
      peak_current_amp: 10.8
      # 参数页「输出转速 30 RPM」——CERB 给的就是**输出端**转速，换算 = π rad/s
      rated_speed_rad_s: 3.1416
      # ── SDO 从站对端契约：固件靠这些绑型号与回读核验 ──
      # 身份串（0x1008:00）是固件按串绑型号的依据；0x6080/0x2538 是它回读比对的
      # 依据，三者必须同源。真机值：
      # R58 = 3325 RPM / 13300 mA。0x6080 是**模块侧共用值**
      # （两型号同为 3325），逐型号的是 0x2538。
      device_identity: R58LITE_V2
      device_max_speed_rpm: 3325
      device_max_current_ma: 13300

  cerb_r48_101:
    protocol: cerb
    parameters:
      # Kt = 0.1 N·m/A（电机侧），减速器效率 50%。
      mit_position_limit_rad: 3.14
      mit_velocity_limit_rad_s: 3.14
      mit_torque_limit_nm: 300.0
      mit_kp_raw_bits: 12
      mit_kd_raw_bits: 12
      mit_kp_limit: 2500.0             # Nm/rad；0x2544 的默认满量程
      mit_kd_limit: 500.0              # Nm·s/rad；0x2545 的默认满量程
      mit_kp_resolution: 0.6105006105006106  # Nm/rad/LSB，2500/4095
      mit_kd_resolution: 0.1221001221001221  # Nm·s/rad/LSB，500/4095
      torque_constant_nm_per_amp: 0.1
      gear_ratio: 101
      gear_efficiency: 0.5
      rated_torque_nm: 5.0
      peak_torque_nm: 11.0
      rated_current_amp: 1.3
      peak_current_amp: 3.2
      # 参数页「输出转速 30 RPM」——输出端转速，换算 = π rad/s
      rated_speed_rad_s: 3.1416
      # ── SDO 从站对端契约：固件靠这些绑型号与回读核验 ──
      # 身份串（0x1008:00）是固件按串绑型号的依据；0x6080/0x2538 是它回读比对的
      # 依据，三者必须同源。真机值：
      # R48 = 3325 RPM / 5000 mA。0x6080 是**模块侧共用值**
      # （两型号同为 3325），逐型号的是 0x2538。
      device_identity: R48LITE_V2
      device_max_speed_rpm: 3325
      device_max_current_ma: 5000
