; PlatformIO Project Configuration File
;
; STM32H723VGT6 空工程 —— micro-ROS 客户端（serial 传输 over USB CDC，humble）
; + FreeRTOS（STM32duino STM32FreeRTOS，参考 husarion/micro_ros_stm32_template）
;
; 空工程骨架：仅 micro-ROS 节点初始化 + FreeRTOS 任务编排（无业务逻辑）。
;
; 关键决策（详见 README.md）：
;   - framework = arduino：micro_ros_platformio 官方仅支持 arduino 框架
;     （stm32cube 框架无法使用官方 PlatformIO 集成，需自定义传输，故弃用）
;   - board_microros_distro = humble：与 micro_ros_agent（humble）对齐
;   - board_microros_transport = serial：micro-ROS 侧保持 serial 传输，
;     物理层走 USB CDC（PA11=USB_DM / PA12=USB_DP），agent 以 /dev/ttyACM0 对接
;   - FreeRTOS：STM32FreeRTOS（stm32duino）与 Arduino 核心共存，调度器接管 SysTick，
;     micro-ROS 在独立任务中建链/收发（参考模板 xTaskCreate + vTaskStartScheduler）
;   - 引脚/话题等硬件映射在 src/main.cpp 顶部常量集中配置

[env:stm32h723vgt6]
platform = ststm32
board = stm32h723vgt6
framework = arduino

; ---- micro-ROS 配置（由 micro_ros_platformio 的 extra_script 读取）----
board_microros_distro = humble
board_microros_transport = serial

; ---- USB CDC 传输（PA11=USB_DM / PA12=USB_DP）----
; PIO_FRAMEWORK_ARDUINO_ENABLE_CDC：
;   触发 STM32duino 构建 USBDevice 库（USBD_USE_CDC + USBCON + HAL_PCD_MODULE_ENABLED），
;   并使 generic Serial 映射为 USB CDC（SerialUSB）。
; PIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE：
;   H723 只有 USB_OTG_HS（无独立 USB_OTG_FS），须以 FS 模式 + 内嵌 PHY 使用
;   （USE_USB_HS + USE_USB_HS_IN_FS），引脚即 PA11/PA12。
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DPIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE

; ---- 烧录 / 监视 ----
upload_protocol = stlink
monitor_speed = 115200

; ---- 依赖：micro-ROS for PlatformIO（library.json 声明 extraScript，自动触发构建）----
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
    https://github.com/stm32duino/STM32FreeRTOS
