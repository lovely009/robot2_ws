motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    left_arm:
      transport: socketcan
      interface: can0
    right_arm:
      transport: serial_slcan
      tty: /dev/ttyACM1
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0
      parameters:
        torque_constant_nm_per_amp: 0.35
    motor_2530:
      command:
        kp: 0.008
        kd: 1.0
      parameters:
        torque_constant_nm_per_amp: 0.35
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: rp
      id: 1
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: rp
      id: 2
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: right_arm
      type: motor_2530
      id: 1
