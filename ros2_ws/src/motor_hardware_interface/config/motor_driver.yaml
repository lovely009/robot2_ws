# 电机拓扑与动态参数（唯一入口，经 motor_specs_file 引用 motor.yaml 型号库）。
#
# 分工：
#   - motor.yaml          —— 型号库：静态参数（扭矩常数/减速比/效率等）
#   - 本文件（拓扑+动态） —— 时序 timing、逻辑总线 buses、电机装配 motors，
#                           以及每台电机的动态控制增益 command（kp/kd）
#
# 结构说明：
#   motor_specs_file —— 型号参数库文件（相对本文件目录），见 config/motor.yaml。
#   timing           —— 反馈超时与激活窗口时序。
#   buses            —— 逻辑总线定义（传输类型由 transport 字段决定）：
#                        socketcan    -> interface（Linux SocketCAN 接口，位率由 ip link 配置）
#                        serial_slcan -> tty（CANable2 串口设备；驱动内固定
#                                        C->S8(仲裁 1M)->Y5(数据 5M)->M0->A1->O 配置总线）
#                        transport 缺省为 socketcan；bus_override 只覆盖设备路径。
#   motors           —— 电机实例：type 引用 motor.yaml 型号；command.kp/kd 为
#                        动态调参增益；单电机可覆盖 parameters。

motor_hardware:
  motor_specs_file: motor.yaml

  timing:
    feedback_timeout_s: 0.10
    # 激活窗口：每次尝试在窗口内轮询全部关节反馈，最多重试 3 次。
    initial_feedback_wait_s: 1.0

  buses:
    left_arm:
      transport: serial_slcan
      tty: /dev/ttyACM0
    right_arm:
      transport: serial_slcan
      tty: /dev/ttyACM1

  # 这里是唯一与具体机器人拓扑相关的电机映射。
  # motors 数量不限，也可以混合任意已注册的电机类型与逻辑总线。
  # 当前 14 台仅为示例：电机数量/类型/ID/总线完全由本文件决定，增删改零代码改动。
  #
  # ⚠ 同一总线上 id 必须全局唯一（协议无关），否则：
  #   - 固件侧注册表以 motor_id 为键，而 motor_id 直接等于厂家 node 号
  #     （micro_ros_firmware/lib/motor_control/src/motor_control_discovery.c:102），
  #     重号即进 CONFIG_CONFLICT、拒绝使能；
  #   - 固件 HIL 模拟器 fdcan_motor_sim.py 的 --joint-map 同样以裸 ID 为键，
  #     重号会让 dict() 静默塌缩、关节被顶替。
  #   注意 CERB 与 vaxor 的 CAN 仲裁 ID 空间本可独立（协议位不同），纯主机路径
  #   靠 MotorDriver 按 (bus, type) 分组掩盖了重号，但接固件即暴露。
  #   当前取值对齐 docs/guides/fdcan1-bench-guide.md 的九节点台架方案：
  #   CERB 1–6 + vaxor 7–9（本机每侧 4 台 CERB，故用 1–4 + 7–9）。
  # CERB 的三个 mit_*_limit 必须与电机参数设置页一致（见 cerb-series.md），
  # 此处为示例值。
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: cerb_r58_101
      id: 1
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: cerb_r58_101
      id: 2
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    left_shoulder_pitch:
      joint: left_shoulder_pitch_joint
      bus: left_arm
      type: cerb_r58_101
      id: 3
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    left_elbow_pitch:
      joint: left_elbow_pitch_joint
      bus: left_arm
      type: cerb_r58_101
      id: 4
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: left_arm
      type: vaxor_2550
      id: 7
      command: {kp: 0.008, kd: 1.0}
    left_wrist_pitch:
      joint: left_wrist_pitch_joint
      bus: left_arm
      type: vaxor_2550
      id: 8
      command: {kp: 0.008, kd: 1.0}
    left_wrist_roll:
      joint: left_wrist_roll_joint
      bus: left_arm
      type: vaxor_2550
      id: 9
      command: {kp: 0.008, kd: 1.0}

    right_shoulder_yaw:
      joint: right_shoulder_yaw_joint
      bus: right_arm
      type: cerb_r58_101
      id: 1
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    right_shoulder_roll:
      joint: right_shoulder_roll_joint
      bus: right_arm
      type: cerb_r58_101
      id: 2
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    right_shoulder_pitch:
      joint: right_shoulder_pitch_joint
      bus: right_arm
      type: cerb_r58_101
      id: 3
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    right_elbow_pitch:
      joint: right_elbow_pitch_joint
      bus: right_arm
      type: cerb_r58_101
      id: 4
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    right_wrist_yaw:
      joint: right_wrist_yaw_joint
      bus: right_arm
      type: vaxor_2550
      id: 7
      command: {kp: 0.008, kd: 1.0}
    right_wrist_pitch:
      joint: right_wrist_pitch_joint
      bus: right_arm
      type: vaxor_2550
      id: 8
      command: {kp: 0.008, kd: 1.0}
    right_wrist_roll:
      joint: right_wrist_roll_joint
      bus: right_arm
      type: vaxor_2550
      id: 9
      command: {kp: 0.008, kd: 1.0}
