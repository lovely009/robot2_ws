# half_body_robot 的执行器拓扑，供模型仿真与固件关节适配读取。
# 实机通过 micro-ROS MCU 执行；整机启动须显式选择并验收本模型配置。
#
# 本模型使用独立仿真拓扑，不能混入真机默认拓扑。
# 仅在机械关节清单统一后合并配置，避免真机驱动不存在的关节。
#
# 拓扑：18 台电机同一条 arm 总线（同一 CAN 域），**两条手臂都驱动**。
# 编号：id 1..9 = 第一链 joint_link1..9；id 10..18 = 第二链 joint_link1.1..9.9。
# **每条手臂的型号从上到下（靠躯干 → 末端）依次为**
#   rb48  rb48  rb58  rb58  rb48  rb48  rb48  vaxor  vaxor
# 即 cerb_r48_101 ×5、cerb_r58_101 ×2、vaxor_2550 ×2（两条链同序列；若实机不对称请改这里）。
# 同总线 ID 必须唯一：固件注册表以 motor_id 为键（= 厂家 node 号，重号即 CONFIG_CONFLICT），
# 固件 HIL 模拟器 fdcan_motor_sim.py 的 --joint-map 同样以裸 ID 为键。
#
# CERB 五项 MIT 量化范围继承权威型号库；自定义档位由单电机 parameters 覆盖。
# 量化满量程与物理扭矩/电流保护阈值独立。
#
# motor_specs_file 指向权威型号库（相对本文件所在目录）。
#
# 本文件不写 timing：仿真侧时序默认继承权威 motor_driver.yaml，本模型在
# simulation_topology.yaml 的 driver_timing 里覆盖要改的那一项（feedback_timeout_s 0.5）。
motor_hardware:
  transmissions_file: transmissions.yaml
  motor_specs_file: ../../../config/motor.yaml

  buses:
    arm:
      transport: serial_slcan
      tty: /dev/ttyACM0

  motors:
    # ── 第一链（joint_link1..9，joint id 1..9）──
    arm_joint1:
      joint: joint_link1
      bus: arm
      type: cerb_r48_101
      id: 1
      command: {kp: 30.0, kd: 1.0}
    arm_joint2:
      joint: joint_link2
      bus: arm
      type: cerb_r48_101
      id: 2
      command: {kp: 30.0, kd: 1.0}
    arm_joint3:
      joint: joint_link3
      bus: arm
      type: cerb_r58_101
      id: 3
      command: {kp: 30.0, kd: 1.0}
    arm_joint4:
      joint: joint_link4
      bus: arm
      type: cerb_r58_101
      id: 4
      command: {kp: 30.0, kd: 1.0}
    arm_joint5:
      joint: joint_link5
      bus: arm
      type: cerb_r48_101
      id: 5
      command: {kp: 30.0, kd: 1.0}
    arm_joint6:
      joint: joint_link6
      bus: arm
      type: cerb_r48_101
      id: 6
      command: {kp: 30.0, kd: 1.0}
    arm_joint7:
      joint: joint_link7
      bus: arm
      type: cerb_r48_101
      id: 7
      command: {kp: 30.0, kd: 1.0}
    arm_joint8:
      joint: joint_link8
      bus: arm
      type: vaxor_2550
      id: 8
      command: {kp: 0.008, kd: 1.0}
    arm_joint9:
      joint: joint_link9
      bus: arm
      type: vaxor_2550
      id: 9
      command: {kp: 0.008, kd: 1.0}

    # ── 第二链（joint_link1.1..9.9，joint id 10..18；型号序列与第一链相同）──
    arm_joint1.1:
      joint: joint_link1.1
      bus: arm
      type: cerb_r48_101
      id: 10
      command: {kp: 30.0, kd: 1.0}
    arm_joint2.2:
      joint: joint_link2.2
      bus: arm
      type: cerb_r48_101
      id: 11
      command: {kp: 30.0, kd: 1.0}
    arm_joint3.3:
      joint: joint_link3.3
      bus: arm
      type: cerb_r58_101
      id: 12
      command: {kp: 30.0, kd: 1.0}
    arm_joint4.4:
      joint: joint_link4.4
      bus: arm
      type: cerb_r58_101
      id: 13
      command: {kp: 30.0, kd: 1.0}
    arm_joint5.5:
      joint: joint_link5.5
      bus: arm
      type: cerb_r48_101
      id: 14
      command: {kp: 30.0, kd: 1.0}
    arm_joint6.6:
      joint: joint_link6.6
      bus: arm
      type: cerb_r48_101
      id: 15
      command: {kp: 30.0, kd: 1.0}
    arm_joint7.7:
      joint: joint_link7.7
      bus: arm
      type: cerb_r48_101
      id: 16
      command: {kp: 30.0, kd: 1.0}
    arm_joint8.8:
      joint: joint_link8.8
      bus: arm
      type: vaxor_2550
      id: 17
      command: {kp: 0.008, kd: 1.0}
    arm_joint9.9:
      joint: joint_link9.9
      bus: arm
      type: vaxor_2550
      id: 18
      command: {kp: 0.008, kd: 1.0}
