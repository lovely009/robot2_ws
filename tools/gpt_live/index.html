<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-Live · 语音对话</title>
<style>
  :root { color-scheme: light; font: 16px/1.6 system-ui,sans-serif; background: #f3f4ef; color: #202923 }
  body { max-width: 720px; margin: 8vh auto; padding: 24px }
  main { background: white; border: 1px solid #d9dfd9; border-radius: 20px; padding: 32px }
  h1 { margin: 0; font-size: 30px } .eyebrow { color: #39755b; letter-spacing: .12em; font-size: 12px }
  button { font: inherit; padding: 10px 20px; border: 1px solid #c5d2ca; border-radius: 10px; cursor: pointer; background: white; margin: 4px }
  #start { background: #245b43; color: white } button:disabled { opacity: .45; cursor: default }
  button:focus-visible, input:focus-visible { outline: 3px solid #7fae95; outline-offset: 3px }
  label { display: block; font-weight: 600 }
  input { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #c5d2ca; border-radius: 10px; font: inherit }
  #status { min-height: 52px; overflow-wrap: anywhere } audio { width: 100%; margin-top: 20px }
  small { display: block; color: #536258; margin: 20px 0 }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; font-size: 13px }
  @media(max-width: 500px) { body { margin: 16px auto; padding: 12px } main { padding: 20px } }
</style>
<main>
  <p class="eyebrow">GPT-LIVE-1 / LOCAL CONSOLE</p>
  <h1>开口聊聊。</h1>
  <p>连接后直接说话，助手会通过扬声器回答。建议佩戴耳机。</p>
  <label for="api-key">OpenAI API 密钥</label>
  <input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="sk-…（留空使用本机默认密钥）" aria-describedby="key-help">
  <small id="key-help">仅用于本次连接，不写入文件或浏览器存储。填写的密钥通过本地服务连接 OpenAI。</small>
  <p id="status" role="status" aria-live="polite">尚未连接</p>
  <button id="start">开始对话</button><button id="mute" disabled>麦克风静音</button><button id="stop" disabled>结束对话</button>
  <audio id="audio" autoplay controls aria-label="助手语音播放"></audio>
  <small>点击开始才申请麦克风权限。语音发送至 OpenAI；连接及后台模型会产生 API 费用，静音不会结束计费，聊完请点击结束。</small>
  <details><summary>连接事件</summary><pre id="events"></pre></details>
</main>
<script type="module" src="/app.js"></script>
</html>
