; DM-MC-Board02 / STM32H723VGT6
; Arduino + STM32FreeRTOS + micro-ROS Humble，经 USB CDC 通信
;
; 板级时钟契约：
;   HSE     = 24 MHz 晶振
;   SYSCLK  = 480 MHz
;   HCLK    = 240 MHz
;   PCLKx   = 120 MHz
;   FDCAN   = 80 MHz（PLL2Q）
;   USB     = HSI48 + CRS 以 USB1 SOF 同步
;

[env:stm32h723vgt6]
; 固定平台版本：与基线验证时实际安装的一致（~/.platformio/platforms/ststm32）。
; 改动会触发平台重装，离线环境下请勿随意升级。
platform = ststm32@19.7.1
board = stm32h723vgt6
framework = arduino

; 显式指定工程链接脚本。保持其为链接配置的唯一事实来源。
board_build.ldscript = ldscript/stm32h723vgt6.ld

; stm32duino 的 F_CPU 是运行时变量
; SystemCoreClock，真正的 SYSCLK 校验在 src/system_clock.cpp 的
; VerifyCoreClocks() 中完成；此处仅用于记录预期的 PLL1 时钟。
board_build.f_cpu = 480000000L

; micro-ROS
board_microros_distro = humble
board_microros_transport = serial

build_flags =

    ; 优化等级契约：显式钉住与基线一致的 -Os，防工具链默认漂移；
    ; 改优化级须 pio run -t clean 全量重建，并重测 motor_rt WCET/jitter。
    -Os

    ; USB OTG_HS 控制器，使用其内部 FS PHY（PA11/PA12）
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DPIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE

    ; 本固件所需的 HAL 模块。OSPI 不在此定义：H723 板级 variant
    ; 已无条件启用 HAL_OSPI_MODULE_ENABLED，重复定义只产生告警。
    -DHAL_FDCAN_MODULE_ENABLED
    -DHAL_IWDG_MODULE_ENABLED

    ; FreeRTOS 工程策略
    -DconfigSUPPORT_STATIC_ALLOCATION=1
    ; 板载晶振 24MHz，必须显式覆盖 CMSIS 的 H7 默认 HSE_VALUE=25MHz：
    -DHSE_VALUE=24000000U

    ; 预期 SYSCLK 的唯一事实来源，与 system_clock.cpp 共享。
    ; 在 VerifyCoreClocks() 中于运行时强制校验；stm32duino 的 F_CPU
    ; 是运行时变量 SystemCoreClock，因此无法用编译期断言钉死。
    -DDM_MC_EXPECTED_SYSCLK_HZ=480000000U
    -DDM_MC_EXPECTED_HSE_HZ=24000000U

    ; 台架自答调试开关（默认注释）：启用后三路 FDCAN 走 EXTERNAL_LOOPBACK，
    ; 控制器自答自己的帧，空总线也能发出 SYNC/命令供嗅探器观察。代价：MON
    ; 位使本节点不给总线上其他节点应答——接真实电机或完整台架前必须关闭
    ; （改宏后须 pio run -t clean 全量重建）。
    ; -DFDCAN_SELF_ACK_BENCH

upload_protocol = stlink
; USB CDC 忽略波特率，此值仅为 pio device monitor 的缺省参数
monitor_speed = 115200

; Git 依赖固定到已通过 host CTest 与目标固件构建的提交，保证 clean bootstrap
; 不随远端默认分支漂移。升级时必须更新 SHA 并重新执行完整验证；不要用
; clean_microros 代替普通固件 clean build。
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
    https://github.com/stm32duino/STM32FreeRTOS.git#3326261b5f3cf6a5b24d4b3fac4551761db721d9

; 注：自定义消息包经 extra_packages/ 目录自动进入 micro-ROS 构建；
; 消息唯一来源是 ../micro_ros_agent/src/can_bridge_msgs（此处仅是符号链接，勿在固件侧另建）。
