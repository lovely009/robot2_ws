motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10

  # 逻辑总线名可以自由定义；新增/删除总线只改这里，不需要修改 C++。
  # SocketCAN 的物理位率由 Linux `ip link` 配置，本文件只负责接口映射。
  buses:
    left_arm:
      interface: can0
    right_arm:
      interface: can1

  # 默认参数按 motor.type 选择。某个具体电机可用自己的 command/parameters 覆盖默认值。
  # 新增电机家族时在 motor_canfd_drive 中增加协议策略，而不是修改通用驱动循环。
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0

    motor_2530:
      command:
        kp: 0.008
        kd: 1.0
      parameters:
        # 当前 0.35 Nm/A 只是沿用旧实现的仿真假设，不是真机已验证参数。
        # 接真实 25/30 mm 电机前，必须替换为对应型号经过确认的 Nm/A 扭矩常数。
        torque_constant_nm_per_amp: 0.35

  # 这里是唯一与具体机器人拓扑相关的电机映射。
  # motors 数量不限，也可以混合任意已注册的电机类型与逻辑总线。
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: rp
      id: 1
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: rp
      id: 2
    left_shoulder_pitch:
      joint: left_shoulder_pitch_joint
      bus: left_arm
      type: rp
      id: 3
    left_elbow_pitch:
      joint: left_elbow_pitch_joint
      bus: left_arm
      type: rp
      id: 4
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: left_arm
      type: motor_2530
      id: 1
    left_wrist_pitch:
      joint: left_wrist_pitch_joint
      bus: left_arm
      type: motor_2530
      id: 2
    left_wrist_roll:
      joint: left_wrist_roll_joint
      bus: left_arm
      type: motor_2530
      id: 3

    right_shoulder_yaw:
      joint: right_shoulder_yaw_joint
      bus: right_arm
      type: rp
      id: 1
    right_shoulder_roll:
      joint: right_shoulder_roll_joint
      bus: right_arm
      type: rp
      id: 2
    right_shoulder_pitch:
      joint: right_shoulder_pitch_joint
      bus: right_arm
      type: rp
      id: 3
    right_elbow_pitch:
      joint: right_elbow_pitch_joint
      bus: right_arm
      type: rp
      id: 4
    right_wrist_yaw:
      joint: right_wrist_yaw_joint
      bus: right_arm
      type: motor_2530
      id: 1
    right_wrist_pitch:
      joint: right_wrist_pitch_joint
      bus: right_arm
      type: motor_2530
      id: 2
    right_wrist_roll:
      joint: right_wrist_roll_joint
      bus: right_arm
      type: motor_2530
      id: 3
