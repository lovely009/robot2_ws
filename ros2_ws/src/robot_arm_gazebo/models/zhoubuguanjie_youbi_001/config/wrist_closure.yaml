# 腕部远置驱动连杆机构的闭环参数（wrist_closure_solver.py 的唯一配置入口）。
#
# 机构：两台 X25S 关节电机**固定在小臂（Joint_link4）上**，各自经「曲柄—连杆」驱动十字轴腕
# 的一个自由度；两个电机的转角**共同**决定腕部的两个自由度。URDF 是树，闭环切在「连杆末端
# 球心」这条边上（见 README 的腕部章节），本文件补上切开处缺掉的几何量：
#   1. 曲柄端球心 crank_pin_offset：连杆两端都是关节轴承（＝球铰），球心才是「二力杆」的
#      端点，而 URDF 里 Joint_link9 的原点并不在球心上（差约 10 mm）；
#   2. 杆长 L = |crank_pin_offset|，由它推出，不单独配置（避免与球心不一致）。
# **腕端**不再有 wrist_ball_offset：球铰的回转中心就是连杆原点，连杆原点是钉在
# Joint_link6 上的，而 mesh 反演出的腕端球心与它只差 ≤2.1 mm（拟合噪声量级）。早先把
# wrist_ball_offset 当作**连杆系**里的偏移用，它会随连杆自转一起转，与「连杆原点钉死」
# 矛盾 —— 实测漏出 1~3 mm 位置残差，已去掉。
#
# ⚠ 可达行程（本模型的结构性限制，2026-10-10 实测）
#   连杆 A 分支把能闭上的行程限在 |joint_link5|, |joint_link6| ≲ 0.85 rad（≈49°）：
#   ±0.8 rad 内 225 个位形全可解（最差裕度 0.994），±0.9 rad 起开始出现无解位形，
#   ±1.4 rad 时 24/225 无解。**URDF 里 joint_link5/6 的 ±1.5708 是占位限位，超过了
#   连杆机构实际能闭上的范围**。超出可达域时求解器只夹紧并告警，不外推。
# 曲柄回转轴**不在本文件里** —— 它就是 URDF 的 joint_crank_a/_b（轴 = 电机输出轴，由 X25S
# mesh 圆柱拟合实测，原点放在轴线上、局部 z 即输出轴）。同一个量只写一处。
#
# ⚠ 数值来源与不确定度（2026-10-10，未做真机标定）
#   - crank_pin_offset：由 mesh 反演（曲柄端取关节轴承盘中心，不确定度约 ±1 mm）+ 带边界的
#     闭环可解性标定（要求「曲柄圆 ∩ 杆长球面」在可达行程内处处有解；边界 ±15 mm，实测
#     最优解就是 mesh 反演值本身）。**它与 URDF 里 Joint_link9/_0 的原点相差约 10 mm** ——
#     那个 joint origin 本来就不在球心上（CAD 里零件就在那儿），本值绕开它，不要反过来
#     去「修」URDF 的 joint origin。
#   - 标定后两分支的曲柄半径几乎相同（见求解器启动日志），是轴取对了的旁证。
#
# 坐标约定：球心偏移用各自 rod_link 的局部系。单位一律 SI（米）。改这里不需要改代码。

branch_a:
  rod_link: Joint_link7
  ball_joint: joint_wrist_ball_a      # 球铰第一轴（求解器写入）
  rod_joint: joint_link7              # 球铰第二轴（求解器写入）
  crank_joint: joint_crank_a          # 曲柄转角（求解器写入）
  crank_pin_offset: [-0.101166623, -0.013918539, -0.000107448]

branch_b:
  rod_link: Joint_link7_0
  ball_joint: joint_wrist_ball_b
  rod_joint: joint_link7_0
  crank_joint: joint_crank_b
  crank_pin_offset: [-0.069428295, 0.004961628, -0.003215417]

solver:
  # 球铰两轴的限位（与 urdf 里 joint_wrist_ball_*/joint_link7* 的 <limit> 一致）。
  # ⚠ 取 ±π 是**有意**的：这两个角是球铰的分解角、没有物理意义，该分解在腕部行程边缘接近
  # 奇异（±90° 行程内 α 可达 176°，而连杆轴向真实摆动只有 98°）。真正的安全网是几何
  # 可行性判据：无解即夹紧并告警。详见 urdf 里 wrist_ball_a 上方的注释。
  ball_limit_rad: 3.1416
  # 曲柄转角限位（与 urdf 里 joint_crank_* 的 <limit> 一致）。同样取 ±π：曲柄角会先
  # 回绕进 [-π, π] 再比限位，取小于 π 的值会在行程边缘造成假超限（实测 3.15 会漏 7 mm）。
  crank_limit_rad: 3.1416
  # 位置残差告警阈值：位置应精确为 0，超过它就打日志（米）
  position_warn_m: 1.0e-06
