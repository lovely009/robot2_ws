  - {id: 9, joint: left_shoulder_roll, template: cerb_r58_101, overrides: {}}
  - {id: 10, joint: left_shoulder_yaw, template: cerb_r48_101, overrides: {}}
  - {id: 11, joint: left_elbow_pitch, template: cerb_r48_101, overrides: {}}
  - {id: 12, joint: left_forearm_yaw, template: cerb_r48_101, overrides: {}}
