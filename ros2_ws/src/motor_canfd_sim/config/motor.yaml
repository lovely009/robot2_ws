# 仿真侧电机型号库（来源：仿真模型）。
#
# 与真机型号库（motor_hardware_interface/config/motor.yaml）结构一致：
# motor_types.<型号>.protocol 声明所属协议；parameters 为协议运行所需参数。
# 本文件只包含仿真拓扑用到的型号；扭矩常数等为仿真假设，不是真机已验证参数。
motor_types:
  # ── RP 系列行星关节（肩/肘）──
  rp-50h:
    protocol: rp
    parameters:
      rated_torque_nm: 10.0
      peak_torque_nm: 30.0

  # ── VAXOR 25/30 mm 腕部电机 ──
  # 当前 0.35 Nm/A 是仿真假设，不是真机已验证参数；只影响仿真行为。
  vaxor_2550:
    protocol: vaxor
    parameters:
      torque_constant_nm_per_amp: 0.35
