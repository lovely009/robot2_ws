motor_hardware:
  motor_specs_file: motor_specs.yaml
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    left_arm:
      transport: socketcan
      interface: can0
    right_arm:
      transport: serial_slcan
      tty: /dev/ttyACM1
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: vaxor_2530
      id: 1
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: vaxor_2530
      id: 2
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: right_arm
      type: vaxor_2530
      id: 1
