motor_canfd_sim:
  ros__parameters:
    left_interface: vcan0
    right_interface: vcan1
    allow_hardware_interfaces: false

    control_rate_hz: 500.0
    status_rate_hz: 50.0
    command_timeout_s: 0.15

    rp_torque_limit_nm: 60.0
    # 以下腕部参数与原 Python Gazebo bridge 保持一致；Nm/A 仍是待真机标定的仿真假设。
    wrist_torque_constant_nm_per_amp: 0.35
    wrist_current_limit_a: 11.0
    wrist_torque_limit_nm: 5.0
    wrist_position_mode_gain_a_per_rad: 5.0
    wrist_position_mode_damping_a_per_rad_s: 0.08
    wrist_velocity_mode_gain_a_per_rad_s: 0.45

    rp_ids: [1, 2, 3, 4]
    wrist_nodes: [1, 2, 3]
    joint_names:
      - left_shoulder_yaw_joint
      - left_shoulder_roll_joint
      - left_shoulder_pitch_joint
      - left_elbow_pitch_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
      - right_shoulder_yaw_joint
      - right_shoulder_roll_joint
      - right_shoulder_pitch_joint
      - right_elbow_pitch_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
