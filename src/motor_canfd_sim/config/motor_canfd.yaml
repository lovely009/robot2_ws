# 仿真侧电机拓扑配置（来源：仿真模型）。
#
# 本文件描述电机侧模拟器在 vcan 上扮演哪些电机，拓扑必须与仿真模型一致：
# 关节清单与顺序对齐 upper_body_canfd_gazebo 的 URDF 和 Gazebo effort
# controller（controllers.yaml）关节顺序，模拟器按此顺序把 Gazebo joint state
# 编码为反馈帧。
#
# 真机拓扑在 motor_hardware_interface/config/motor_canfd.yaml，两侧各自演进；
# 新增/删除关节或电机时，需要同步修改仿真模型（URDF/controller）与本文件。
motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    # 激活窗口：每次尝试在窗口内轮询全部关节反馈，最多重试 3 次。
    initial_feedback_wait_s: 1.0

  # 逻辑总线名可以自由定义；仿真默认挂到 vcan，接口仍可由
  # bus_override.<逻辑总线名> 在启动时覆盖。
  buses:
    left_arm:
      interface: vcan0
    right_arm:
      interface: vcan1

  # 默认参数按 motor.type 选择。某个具体电机可用自己的 command/parameters 覆盖默认值。
  # 新增电机家族时在 motor_canfd_drive 中增加协议策略，而不是修改通用驱动循环。
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0

    motor_2530:
      command:
        kp: 0.008
        kd: 1.0
      parameters:
        # 当前 0.35 Nm/A 是仿真假设，不是真机已验证参数；只影响仿真行为。
        torque_constant_nm_per_amp: 0.35

  # 仿真模型拓扑：左臂 7 自由度 + 右臂 7 自由度，顺序与 Gazebo effort
  # controller 的 joints 列表一致（左肩到左腕，再右肩到右腕）。
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: rp
      id: 1
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: rp
      id: 2
    left_shoulder_pitch:
      joint: left_shoulder_pitch_joint
      bus: left_arm
      type: rp
      id: 3
    left_elbow_pitch:
      joint: left_elbow_pitch_joint
      bus: left_arm
      type: rp
      id: 4
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: left_arm
      type: motor_2530
      id: 1
    left_wrist_pitch:
      joint: left_wrist_pitch_joint
      bus: left_arm
      type: motor_2530
      id: 2
    left_wrist_roll:
      joint: left_wrist_roll_joint
      bus: left_arm
      type: motor_2530
      id: 3

    right_shoulder_yaw:
      joint: right_shoulder_yaw_joint
      bus: right_arm
      type: rp
      id: 1
    right_shoulder_roll:
      joint: right_shoulder_roll_joint
      bus: right_arm
      type: rp
      id: 2
    right_shoulder_pitch:
      joint: right_shoulder_pitch_joint
      bus: right_arm
      type: rp
      id: 3
    right_elbow_pitch:
      joint: right_elbow_pitch_joint
      bus: right_arm
      type: rp
      id: 4
    right_wrist_yaw:
      joint: right_wrist_yaw_joint
      bus: right_arm
      type: motor_2530
      id: 1
    right_wrist_pitch:
      joint: right_wrist_pitch_joint
      bus: right_arm
      type: motor_2530
      id: 2
    right_wrist_roll:
      joint: right_wrist_roll_joint
      bus: right_arm
      type: motor_2530
      id: 3
