# chest_upper_00 在端到端电机仿真（simulation.launch.py）里的电机映射。
#
# 电机名（chest_jointN）引用 motor_hardware_interface/config/motor_driver.yaml
# 的 motor_hardware.motors；型号参数（扭矩常数/减速比/效率）引用同目录 motor.yaml。
# 本文件只写「哪些电机参与本模型的仿真、各接哪个关节、用哪个 profile」。
#
# 拓扑：9 台电机全部接在同一条 chest 总线上，编号与关节序号一一对应
# （joint_linkN ↔ id N）。id 1–7 是 CERB（cerb_r58_101），id 8–9 是 vaxor（vaxor_2550）。
# 同总线 ID 必须唯一：固件注册表以 motor_id 为键（= 厂家 node 号），
# 固件 HIL 模拟器 fdcan_motor_sim.py 的 --joint-map 同样以裸 ID 为键。
simulation:
  model: chest_upper_00

  timing:
    control_hz: 100
    vaxor_feedback_hz: 50
    command_timeout_ms: 150

  # 仿真驱动时序覆盖（默认继承 motor_driver.yaml 的 timing）。CERB 在仿真里只在收到
  # 命令帧后回帧（无周期上报），而驱动器激活路径自带 100ms 上伺服等待加控制器首拍
  # 延迟，合计约 215ms 命令空窗；权威配置的 0.1s 会把这段静默误判成反馈超时
  # （002 台架实测 joint_link1）。放宽到 0.5s 仅作用于仿真生成的驱动配置，不影响真机。
  driver_timing:
    feedback_timeout_s: 0.5

  profiles:
    # 与 zhoubuguanjie_youbi_002 的 cerb_r58 profile 逐字相同（已实测跑通的配置）。
    cerb_r58:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # 与 motor_driver.yaml 里 chest 总线 CERB 各台的 command.kp/kd 一致。
        kp: 30.0
        kd: 1.0

    # 末端两台 X25S（vaxor_2550）。
    vaxor_2550:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # motor_driver.yaml 的 command 是**协议码值**；motor_sim 在 MIT 模式下按
        #   gain_scale = Kt × 减速比² × 效率 = 0.042 × 50² × 0.65 = 68.25
        # 换算成关节侧量纲（见 motor_sim/src/core/frame_router.cpp 的 gain_scale）。
        # 因此 plant 取：kp = 0.008 × 68.25，kd = 1.0 × 68.25。
        kp: 0.546
        kd: 68.25
        # vaxor 型号库（motor.yaml）只有 Kt/减速比/效率，**没有额定/峰值电流**，
        # 而 simulation.launch.py 要求 plant.current_limit_a 为正。
        # 这里取 motor_drive/docs/motor-2530-series.md 的「最大堵转电流 3.2 A」。
        current_limit_a: 3.2

  motors:
    - motor: chest_joint1
      joint: joint_link1
      profile: cerb_r58
    - motor: chest_joint2
      joint: joint_link2
      profile: cerb_r58
    - motor: chest_joint3
      joint: joint_link3
      profile: cerb_r58
    - motor: chest_joint4
      joint: joint_link4
      profile: cerb_r58
    - motor: chest_joint5
      joint: joint_link5
      profile: cerb_r58
    - motor: chest_joint6
      joint: joint_link6
      profile: cerb_r58
    - motor: chest_joint7
      joint: joint_link7
      profile: cerb_r58
    - motor: chest_joint8
      joint: joint_link8
      profile: vaxor_2550
    - motor: chest_joint9
      joint: joint_link9
      profile: vaxor_2550
