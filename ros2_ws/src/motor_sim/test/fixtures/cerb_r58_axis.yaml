# CE-RB-R58-101（峰值 45 N·m）：与 cerb_axis.yaml 同形状，型号量程换成 R58。
motor_simulation:
  timing:
    control_hz: 100
    vaxor_feedback_hz: 50
    command_timeout_ms: 150
  buses:
    - {name: arm, transport: socket_can, endpoint: robot_vcan0}
  profiles:
    cerb_r58_axis:
      hard_lower_deg: -360
      hard_upper_deg: 360
      command_lower_deg: -355
      command_upper_deg: 355
      velocity_rad_s: 2.0
      # plant 饱和与 τ_ff 量化满量程是两回事：本 fixture 照拓扑取 10.0，量程取型号峰值 45.0。
      effort_nm: 10.0
      mit_torque_limit_nm: 45.0
      device_identity: R58LITE_V2
      device_max_speed_rpm: 3325
      device_max_current_ma: 13300
      gear_ratio: 101.0
      efficiency: 1.0
      plant: {kp: 30.0, kd: 1.0, torque_constant_nm_per_a: 0.086, current_limit_a: 10.8}
  motors:
    - {joint: joint_cerb58, bus: arm, protocol: cerb, id: 3, profile: cerb_r58_axis}
