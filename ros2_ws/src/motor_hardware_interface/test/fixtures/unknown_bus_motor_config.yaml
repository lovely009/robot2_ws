motor_hardware:
  motor_specs_file: motor_specs.yaml
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    left_arm:
      transport: socketcan
      interface: can0
    bench:
      transport: serial_slcan
      tty: /dev/ttyACM2
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: rp-50h
      id: 1
