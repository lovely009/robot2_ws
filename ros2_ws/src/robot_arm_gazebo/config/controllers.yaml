# gz_ros2_control 插件读取的 controller_manager 参数。
# 顶层键用通配 /**/：无论是否加命名空间都能匹配，避免参数文件被静默忽略。
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

/**/arm_position_controller:
  ros__parameters:
    joints:
      - joint_link1
      - joint_link2
      - joint_link3
      - joint_link4
    interface_name: position
