motor_canfd_sim:
  ros__parameters:
    # motor_config_file is supplied by launch so the simulator and hardware
    # interface consume the exact same bus/motor/joint mapping.
    motor_config_file: ""
    bus_override.left_arm: vcan0
    bus_override.right_arm: vcan1
    allow_hardware_interfaces: false

    control_rate_hz: 500.0
    status_rate_hz: 50.0
    command_timeout_s: 0.15

    rp_torque_limit_nm: 60.0
    motor_2530_current_limit_a: 11.0
    motor_2530_torque_limit_nm: 5.0
    motor_2530_position_mode_gain_a_per_rad: 5.0
    motor_2530_position_mode_damping_a_per_rad_s: 0.08
    motor_2530_velocity_mode_gain_a_per_rad_s: 0.45
