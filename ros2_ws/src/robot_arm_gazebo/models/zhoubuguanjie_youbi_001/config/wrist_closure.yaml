# 腕部远置驱动连杆机构的闭环参数（wrist_closure_solver.py 的唯一配置入口）。
#
# 机构：两台 X25S 关节电机固定在小臂（Joint_link4）上，各自经「摇臂—连杆」驱动十字轴腕的
# 一个自由度。URDF 是树，闭环在导出时被切开（见 README 的腕部章节）。本文件把切开处
# 缺掉的三样东西补回来，供求解器按闭环约束解出被动关节角：
#   1. 摇臂回转轴 crank_axis_*：摇臂刚性固定在电机输出上 ⇒ 该轴在小臂系里是常量；
#   2. 两端球心 wrist_ball_offset / crank_pin_offset：连杆两端都是关节轴承（球铰），
#      球心才是「二力杆」的两个端点，而 URDF 的 joint_link9 原点并不在球心上；
#   3. 杆长 L 由两个球心之差推出，不单独配置（避免与球心不一致）。
#
# ⚠ 数值来源与不确定度（2026-10-10 实测，未做真机标定）
#   - 球心：由 mesh 反演。
#     腕端 wrist_ball_offset 取连杆眼孔外圆柱（半径≈8.06/8.18 mm）的拟合中心，
#     在连杆局部系里与 link 原点的偏移 ≤2.1 mm（拟合噪声量级）；
#     曲柄端 crank_pin_offset 取关节轴承盘的中心 —— 该盘与穿过它的半圆头螺钉可按
#     ⊥销轴切片分离（盘外径 12 mm、z 向宽 3.35 mm），盘心在 link9 局部系里为
#     (-0.378, -9.893, 2.780) mm／(-1.213, -9.825, 2.980) mm，再按 joint_link9(_0)
#     的 origin 转到连杆系。**URDF 的 joint_link9 原点因此偏离真实球心约 10 mm**，
#     这正是过去闭环算不平的原因之一；数值本身的不确定度约 ±1 mm。
#   - 摇臂轴：**本文件最不确定的一项，请优先核对**。方向取「X25S 电机 mesh 的局部 y 轴、
#     装配零位下」；轴心取该 mesh 的顶点形心。选它的依据是纯运动学判据：把
#     「杆长球面（心 = 腕端球心、半径 L）∩ 曲柄圆」当成约束，要求它在**整个腕部行程**
#     内都有解。实测只有离世界竖直 ~20° 以内的方向满足，而电机 mesh 自身的回转轴
#     （局部 z，离竖直 75°）在任何合理轴心下都不可行 —— 也就是说电机输出轴与摇臂轴
#     不是同一根，中间要么还有一级直角传动，要么本次对 mesh 的解读有误。
#     **待用户在 SolidWorks 里核对：输出法兰法线、摇臂回转中心、摇臂销孔中心到轴的距离。**
#     两分支由此算出的曲柄半径几乎相同（19.57 / 19.51 mm），是当前取值的一个旁证。
#
# 坐标约定：crank_axis_* 用 axis_frame_link 指定的连杆系；球心偏移用各自 rod_link 的局部系。
# 单位一律 SI（米）。改这里不需要改代码。

axis_frame_link: Joint_link4

branch_a:
  rod_link: Joint_link7
  ball_joint: joint_wrist_ball_a      # 求解器写入的球铰第一轴
  rod_joint: joint_link7              # 球铰第二轴（原导出关节）
  pin_joint: joint_link9              # 杆端绕销轴的补偿角
  # 摇臂回转轴：方向 + 轴上一点
  crank_axis_direction: [-0.987397957, 0.116853639, -0.106726297]
  crank_axis_point: [0.005430211, 0.006735269, -0.035250762]
  # 腕端球心（连杆局部系）
  wrist_ball_offset: [0.002070080, 0.000165253, -0.001500000]
  # 曲柄端球心（连杆局部系）
  crank_pin_offset: [-0.101017147, -0.009837965, -0.001220238]

branch_b:
  rod_link: Joint_link7_0
  ball_joint: joint_wrist_ball_b
  rod_joint: joint_link7_0
  pin_joint: joint_link9_0
  crank_axis_direction: [-0.987397872, 0.116861027, -0.106718992]
  crank_axis_point: [0.001099062, -0.034681786, -0.070329409]
  wrist_ball_offset: [-0.000227317, -0.000013505, -0.002593782]
  crank_pin_offset: [-0.065721906, -0.006053674, -0.001893334]

solver:
  # 球铰两轴的限位（与 urdf 里 joint_wrist_ball_* 的 <limit> 一致；超出即夹紧并告警）
  ball_limit_rad: 1.0
  # 位姿残差的告警阈值：位置应精确为 0，姿态残差（销轴补偿角的极限）超过它就打日志
  orientation_warn_deg: 5.0
