motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    socket_bus:
      interface: vcan0
      transport: socketcan
    serial_bus:
      transport: serial_slcan
      tty: /dev/ttyACM0
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0
      parameters:
        torque_constant_nm_per_amp: 0.35
  motors:
    shoulder_yaw:
      joint: shoulder_yaw_joint
      bus: socket_bus
      type: rp
      id: 1
    wrist_pitch:
      joint: wrist_pitch_joint
      bus: serial_bus
      type: rp
      id: 2
