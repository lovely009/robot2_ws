motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    test_bus:
      interface: vcan0
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0
      parameters:
        torque_constant_nm_per_amp: 0.35
    motor_2530:
      command:
        kp: 0.008
        kd: 1.0
      parameters:
        torque_constant_nm_per_amp: 0.35
  motors:
    shoulder_yaw:
      joint: shoulder_yaw_joint
      bus: test_bus
      type: rp
      id: 1
    wrist_pitch:
      joint: wrist_pitch_joint
      bus: test_bus
      type: motor_2530
      id: 2
      parameters:
        torque_constant_nm_per_amp: 0.55
        extra: per_motor
