# 37 轴全身机器人电机参数配置表：3 份型号模板 + 37 台差异配置。
# 关节命名严格对齐 docs/机器人37自由度_关节命名与正方向.xlsx，电机 ID 1..37。
# 通过 `ros2 run motor_hardware_interface motor_param_sync.py --check/--sync` 与驱动板/W25 缓存对账同步。
schema_version: 1

templates:
  vaxor_2550:
    pos_min: -3.14159
    pos_max: 3.14159
    vel_limit: 6.28
    torque_limit: 12.0
    limit_protect: true
    direction: 0
    t_max: 80.0
    kp: 0.008
    kd: 1.0
  cerb_r48_101:
    pos_min: -3.14
    pos_max: 3.14
    vel_limit: 3.14
    torque_limit: 12.0
    limit_protect: true
    direction: 0
    t_max: 80.0
    kp: 30.0
    kd: 1.0
  cerb_r58_101:
    pos_min: -3.14
    pos_max: 3.14
    vel_limit: 3.14
    torque_limit: 36.0
    limit_protect: true
    direction: 0
    t_max: 80.0
    kp: 30.0
    kd: 1.0

motors:
  - {id: 1, joint: waist_yaw, template: cerb_r58_101, overrides: {}}
  - {id: 2, joint: waist_pitch, group: waist, template: cerb_r58_101, overrides: {}}
  - {id: 3, joint: waist_roll, group: waist, template: cerb_r58_101, overrides: {}}
  - {id: 4, joint: pelvis_roll, group: hips, template: cerb_r58_101, overrides: {}}
  - {id: 5, joint: pelvis_pitch, group: hips, template: cerb_r58_101, overrides: {}}
