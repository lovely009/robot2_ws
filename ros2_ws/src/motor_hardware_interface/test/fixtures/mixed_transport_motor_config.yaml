motor_hardware:
  motor_specs_file: motor_specs.yaml
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    socket_bus:
      interface: vcan0
      transport: socketcan
    serial_bus:
      transport: serial_slcan
      tty: /dev/ttyACM0
  motors:
    shoulder_yaw:
      joint: shoulder_yaw_joint
      bus: socket_bus
      type: vaxor_2530
      id: 1
      command: {kp: 30.0, kd: 1.0}
    wrist_pitch:
      joint: wrist_pitch_joint
      bus: serial_bus
      type: vaxor_2530
      id: 2
      command: {kp: 30.0, kd: 1.0}
