# 顶层键必须是节点全限定名：插件把 controller_manager 放在 /robot_arm 命名空间下，
# 裸键匹配不上会导致整个参数文件被静默忽略。
/robot_arm/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    effort_controller:
      type: forward_command_controller/ForwardCommandController

/robot_arm/effort_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: effort
