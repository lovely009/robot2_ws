# zhoubuguanjie_youbi_002 在端到端电机仿真（simulation.launch.py）里的电机映射。
#
# 电机名（right_shoulder_yaw 等）引用 motor_hardware_interface/config/motor_driver.yaml
# 的 motor_hardware.motors；型号参数（扭矩常数/减速比/效率）引用同目录 motor.yaml。
# 本文件只写「哪些电机参与本模型的仿真、各接哪个关节、用哪个 profile」。
#
# ⚠ 与 001 的差别：001 只接管肩肘 4 台 CERB（腕部是远置驱动连杆，没有直驱关节，
# 在 Gazebo 里按被动动力学运动）。002 取消了连杆，腕部是直接驱动的串联关节
# joint_link5 / joint_link6，因此本文件把 6 台电机全部接进来。
#
# 注意 simulation.launch.py 的约束：**所有电机必须在同一条总线上**
# （right_arm 总线，7 台电机里用了 6 台；right_wrist_roll 没有对应关节，不接）。
simulation:
  model: zhoubuguanjie_youbi_002

  timing:
    control_hz: 100
    vaxor_feedback_hz: 50
    command_timeout_ms: 150

  # 仿真驱动时序覆盖（默认继承 motor_driver.yaml 的 timing）。CERB 在仿真里
  # 只在收到命令帧后回帧（无周期上报），而驱动器激活路径自带 100ms 上伺服等待
  # 加控制器首拍延迟，合计约 215ms 命令空窗；权威配置的 0.1s 会把这段静默误判
  # 成反馈超时（实测 joint_link1）。放宽到 0.5s 仅作用于仿真生成的驱动配置，
  # 不影响真机。
  driver_timing:
    feedback_timeout_s: 0.5

  profiles:
    # 与 001 的 cerb_r58 profile 逐字相同（已实测跑通的配置）。
    cerb_r58:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # 与 motor_driver.yaml 里 right_arm CERB 四台的 command.kp/kd 一致。
        kp: 30.0
        kd: 1.0

    # 腕部两台 X25S（vaxor_2550）。**001 里没有这个 profile，是本模型新增的。**
    vaxor_2550:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # motor_driver.yaml 的 command 是**协议码值**；motor_sim 在 MIT 模式下按
        #   gain_scale = Kt × 减速比² × 效率 = 0.042 × 50² × 0.65 = 68.25
        # 换算成关节侧量纲（见 motor_sim/src/core/frame_router.cpp 的 gain_scale）。
        # 因此 plant 取：kp = 0.008 × 68.25，kd = 1.0 × 68.25。
        kp: 0.546
        kd: 68.25
        # vaxor 型号库（motor.yaml）只有 Kt/减速比/效率，**没有额定/峰值电流**，
        # 而 simulation.launch.py 要求 plant.current_limit_a 为正。
        # 这里取 motor_drive/docs/motor-2530-series.md 的「最大堵转电流 3.2 A」。
        current_limit_a: 3.2

  motors:
    - motor: right_shoulder_yaw
      joint: joint_link1
      profile: cerb_r58
    - motor: right_shoulder_roll
      joint: joint_link2
      profile: cerb_r58
    - motor: right_shoulder_pitch
      joint: joint_link3
      profile: cerb_r58
    - motor: right_elbow_pitch
      joint: joint_link4
      profile: cerb_r58
    - motor: right_wrist_yaw
      joint: joint_link5
      profile: vaxor_2550
    - motor: right_wrist_pitch
      joint: joint_link6
      profile: vaxor_2550
