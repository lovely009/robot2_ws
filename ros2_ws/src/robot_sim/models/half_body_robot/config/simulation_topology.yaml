# half_body_robot（半身机器人）在端到端电机仿真（simulation.launch.py）里的电机映射。
#
# 电机名（arm_jointN / arm_jointN.N）定义在本目录的 config/motor_driver.yaml（模型自带、
# 仿真专用，simulation.launch.py 在 motor_config_file 留空时优先取它）；型号参数（扭矩常数/
# 减速比/效率/力矩阈值）引用 motor_hardware_interface/config/motor.yaml。
# 本文件只写「哪些电机参与本模型的仿真、各接哪个关节、用哪个 profile」。
#
# 拓扑：18 台电机全部接在同一条 arm 总线上，**两条手臂都驱动**。
#   id 1..9   = 第一链 joint_link1..9
#   id 10..18 = 第二链 joint_link1.1..9.9
# **每条手臂的型号从上到下（靠躯干 → 末端）依次为**
#   rb48  rb48  rb58  rb58  rb48  rb48  rb48  vaxor  vaxor
# 即 id 1,2,5,6,7 = cerb_r48_101；id 3,4 = cerb_r58_101；id 8,9 = vaxor_2550；
# 第二链按同样序列顺延（10,11,14,15,16 = r48；12,13 = r58；17,18 = vaxor）。
# 两条链同序列是**假设**（半身机器人实机若不对称，改本文件与 motor_driver.yaml 即可）。
#
# 同总线 ID 必须唯一：固件注册表以 motor_id 为键（= 厂家 node 号），
# 固件 HIL 模拟器 fdcan_motor_sim.py 的 --joint-map 同样以裸 ID 为键。
simulation:
  model: half_body_robot

  timing:
    control_hz: 100
    vaxor_feedback_hz: 50
    command_timeout_ms: 150

  # 仿真驱动时序覆盖（其余键取 simulation.launch.py 的内置默认值，与权威
  # motor_driver.yaml 的 timing 一致）。CERB 在仿真里只在收到命令帧后回帧（无周期
  # 上报），而驱动器激活路径自带 100ms 上伺服等待加控制器首拍延迟，合计约 215ms
  # 命令空窗；权威配置的 0.1s 会把这段静默误判成反馈超时（002 台架实测 joint_link1）。
  # 放宽到 0.5s 仅作用于仿真生成的驱动配置，不影响真机。
  driver_timing:
    feedback_timeout_s: 0.5

  profiles:
    # RB48（cerb_r48_101）：id 1,2,5,6,7 与 10,11,14,15,16。
    # 硬限位/命令限位与 effort 沿用 robot_all 的占位口径（±90°/±85°、10 N·m）；
    # 型号库的峰值力矩 11 N·m 与峰值电流 3.2 A 参与换算（current_limit_a 由
    # simulation.launch.py 自动取 peak_current_amp）。
    # ⚠ velocity_rad_s 是假电机 MIT 速度的量化满量程，1.0 现在**比 URDF 的
    # <limit velocity> 窄**（3.1416/4.189），端到端仿真仍被它卡住；见模型 README
    # 的「电机映射」节，未动。
    cerb_r48:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # 与 motor_driver.yaml 里 arm 总线 cerb_r48 各台的 command.kp/kd 一致。
        kp: 30.0
        kd: 1.0

    # RB58（cerb_r58_101）：id 3,4 与 12,13。与 robot_all 的 cerb_r58 profile 同值。
    cerb_r58:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        kp: 30.0
        kd: 1.0

    # 末端四台 X25S（vaxor_2550）：id 8,9 与 17,18。
    vaxor_2550:
      hard_lower_deg: -90.0
      hard_upper_deg: 90.0
      command_lower_deg: -85.0
      command_upper_deg: 85.0
      velocity_rad_s: 1.0
      effort_nm: 10.0
      plant:
        # motor_driver.yaml 的 command 是**协议码值**；motor_sim 在 MIT 模式下按
        #   gain_scale = Kt × 减速比² × 效率 = 0.042 × 50² × 0.65 = 68.25
        # 换算成关节侧量纲（见 motor_sim/src/core/frame_router.cpp 的 gain_scale）。
        # 因此 plant 取：kp = 0.008 × 68.25，kd = 1.0 × 68.25。
        kp: 0.546
        kd: 68.25
        # vaxor 型号库（motor.yaml）只有 Kt/减速比/效率，**没有额定/峰值电流**，
        # 而 simulation.launch.py 要求 plant.current_limit_a 为正。
        # 这里取 motor_drive/docs/motor-2530-series.md 的「最大堵转电流 3.2 A」。
        current_limit_a: 3.2

  motors:
    # ── 第一链 ──
    - motor: arm_joint1
      joint: joint_link1
      profile: cerb_r48
    - motor: arm_joint2
      joint: joint_link2
      profile: cerb_r48
    - motor: arm_joint3
      joint: joint_link3
      profile: cerb_r58
    - motor: arm_joint4
      joint: joint_link4
      profile: cerb_r58
    - motor: arm_joint5
      joint: joint_link5
      profile: cerb_r48
    - motor: arm_joint6
      joint: joint_link6
      profile: cerb_r48
    - motor: arm_joint7
      joint: joint_link7
      profile: cerb_r48
    - motor: arm_joint8
      joint: joint_link8
      profile: vaxor_2550
    - motor: arm_joint9
      joint: joint_link9
      profile: vaxor_2550
    # ── 第二链 ──
    - motor: arm_joint1.1
      joint: joint_link1.1
      profile: cerb_r48
    - motor: arm_joint2.2
      joint: joint_link2.2
      profile: cerb_r48
    - motor: arm_joint3.3
      joint: joint_link3.3
      profile: cerb_r58
    - motor: arm_joint4.4
      joint: joint_link4.4
      profile: cerb_r58
    - motor: arm_joint5.5
      joint: joint_link5.5
      profile: cerb_r48
    - motor: arm_joint6.6
      joint: joint_link6.6
      profile: cerb_r48
    - motor: arm_joint7.7
      joint: joint_link7.7
      profile: cerb_r48
    - motor: arm_joint8.8
      joint: joint_link8.8
      profile: vaxor_2550
    - motor: arm_joint9.9
      joint: joint_link9.9
      profile: vaxor_2550
