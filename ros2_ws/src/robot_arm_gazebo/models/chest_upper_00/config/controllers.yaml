# chest_upper_00 的 gz_ros2_control 参数。
# 顶层键用通配 /**/：无论是否加命名空间都能匹配，避免参数文件被静默忽略。
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    # 力矩接口（与 position 控制器互斥使用：同一关节不能同时被两条命令接口驱动）。切换：
    #   ros2 control switch_controllers --deactivate arm_position_controller \
    #                                    --activate arm_effort_controller
    arm_effort_controller:
      type: effort_controllers/JointGroupEffortController

# joints 顺序即 Float64MultiArray 命令顺序，必须是 urdf/*.urdf.xacro 的
# <ros2_control> 关节清单的有序子集（由 test_model_consistency.py 兜底）。
#
# 本模型是**纯串联 9 轴**，9 个关节全部声明为可控，控制器接管全部 9 个。顺序必须与 URDF
# 的物理关节顺序一致。关节名是小写 joint_link1..9（link 名才是大写 Joint_link1..9）——
# 导出器原本让二者同名，在 SDFormat 里会导致模型建不起来，故 joint 改小写。
#
# ⚠ 本模型尚未接入 motor_hardware_interface 的电机拓扑：没有 simulation_topology.yaml，
# 因此这 9 个关节暂时没有对应的电机名映射，simulation.launch.py 不能选本模型。
/**/arm_position_controller:
  ros__parameters:
    joints:
      - joint_link1
      - joint_link2
      - joint_link3
      - joint_link4
      - joint_link5
      - joint_link6
      - joint_link7
      - joint_link8
      - joint_link9
    interface_name: position

# JointGroupEffortController 无 interface_name（恒为 effort），只需关节清单。
/**/arm_effort_controller:
  ros__parameters:
    joints:
      - joint_link1
      - joint_link2
      - joint_link3
      - joint_link4
      - joint_link5
      - joint_link6
      - joint_link7
      - joint_link8
      - joint_link9
