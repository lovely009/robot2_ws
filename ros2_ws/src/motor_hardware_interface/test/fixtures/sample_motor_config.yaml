motor_hardware:
  motor_specs_file: motor_specs.yaml
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10
  buses:
    test_bus:
      interface: vcan0
  motors:
    shoulder_yaw:
      joint: shoulder_yaw_joint
      bus: test_bus
      type: vaxor_2530
      id: 1
      command:
        kp: 30.0
        kd: 1.0
    wrist_pitch:
      joint: wrist_pitch_joint
      bus: test_bus
      type: vaxor_2530
      id: 2
      command:
        kp: 0.9
        kd: 0.5
      parameters:
        torque_constant_nm_per_amp: 0.55
        extra: per_motor
