# 顶层键必须是节点全限定名：插件把 controller_manager 放在 /robot_arm 命名空间下，
# 裸键匹配不上会导致整个参数文件被静默忽略。
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    effort_controller:
      type: forward_command_controller/ForwardCommandController
    brake_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/effort_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: effort

# brake_controller 使用 effort 闭环保持当前位置；抱闸协调器使用 STRICT 原子切换，
# 保证它不与外部电机 effort_controller 同时控制关节。以下增益仅为仿真名义值。
/**/brake_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      shoulder_pan_joint: {p: 50.0, i: 0.0, d: 0.0}
      shoulder_lift_joint: {p: 120.0, i: 0.0, d: 0.0}
      elbow_joint: {p: 100.0, i: 0.0, d: 0.0}
      wrist_1_joint: {p: 30.0, i: 0.0, d: 0.0}
      wrist_2_joint: {p: 30.0, i: 0.0, d: 0.0}
      wrist_3_joint: {p: 20.0, i: 0.0, d: 0.0}
