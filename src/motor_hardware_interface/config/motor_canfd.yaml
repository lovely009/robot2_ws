motor_hardware:
  timing:
    feedback_timeout_s: 0.10
    initial_feedback_wait_s: 0.10

  # Logical bus names are arbitrary. Add/remove buses here without changing C++.
  # SocketCAN bitrates are configured by Linux (ip link), not by this file.
  buses:
    left_arm:
      interface: can0
    right_arm:
      interface: can1

  # Defaults are selected by motor.type. Per-motor command/parameters can override
  # these values. New motor families add a protocol strategy in motor_canfd_drive.
  motor_types:
    rp:
      command:
        kp: 30.0
        kd: 1.0

    motor_2530:
      command:
        kp: 0.008
        kd: 1.0
      parameters:
        # Simulation placeholder inherited from the previous implementation.
        # Replace with the verified Nm/A value before physical-hardware use.
        torque_constant_nm_per_amp: 0.35

  # This is the only robot-specific motor mapping. The map may contain any number
  # of motors and any mixture of registered motor types/buses.
  motors:
    left_shoulder_yaw:
      joint: left_shoulder_yaw_joint
      bus: left_arm
      type: rp
      id: 1
    left_shoulder_roll:
      joint: left_shoulder_roll_joint
      bus: left_arm
      type: rp
      id: 2
    left_shoulder_pitch:
      joint: left_shoulder_pitch_joint
      bus: left_arm
      type: rp
      id: 3
    left_elbow_pitch:
      joint: left_elbow_pitch_joint
      bus: left_arm
      type: rp
      id: 4
    left_wrist_yaw:
      joint: left_wrist_yaw_joint
      bus: left_arm
      type: motor_2530
      id: 1
    left_wrist_pitch:
      joint: left_wrist_pitch_joint
      bus: left_arm
      type: motor_2530
      id: 2
    left_wrist_roll:
      joint: left_wrist_roll_joint
      bus: left_arm
      type: motor_2530
      id: 3

    right_shoulder_yaw:
      joint: right_shoulder_yaw_joint
      bus: right_arm
      type: rp
      id: 1
    right_shoulder_roll:
      joint: right_shoulder_roll_joint
      bus: right_arm
      type: rp
      id: 2
    right_shoulder_pitch:
      joint: right_shoulder_pitch_joint
      bus: right_arm
      type: rp
      id: 3
    right_elbow_pitch:
      joint: right_elbow_pitch_joint
      bus: right_arm
      type: rp
      id: 4
    right_wrist_yaw:
      joint: right_wrist_yaw_joint
      bus: right_arm
      type: motor_2530
      id: 1
    right_wrist_pitch:
      joint: right_wrist_pitch_joint
      bus: right_arm
      type: motor_2530
      id: 2
    right_wrist_roll:
      joint: right_wrist_roll_joint
      bus: right_arm
      type: motor_2530
      id: 3
