# robot_all 的**仿真专用**电机拓扑，只供 simulation.launch.py 的
# motor_config_file:= 使用，不参与真机 bring-up（hardware.launch.py 读的是权威配置）。
#
# 为什么不并进权威的 motor_hardware_interface/config/motor_driver.yaml：
#   那份描述**整机**，且 motor_hardware_interface/test/test_xacro_consistency.py 断言
#   其中每台电机的 joint 必须存在于机器人物理模型 urdf/upper_body.urdf.xacro
#   （docstring 原话：「防止 YAML 与物理模型脱节」）。robot_all 的 joint_link1..9
#   目前只存在于 Gazebo 模型，放进权威文件会让该测试变红，也会让真机 bring-up 去驱动
#   不存在的关节。
#   ⚠ 待这 9 个关节并入 upper_body.urdf.xacro 后，应把本文件并回权威配置并删除本文件。
#
# 拓扑：9 台电机同一条 chest 总线，编号与关节序号一一对应（joint_linkN ↔ id N）。
# id 1-7 为 CERB（cerb_r58_101），id 8-9 为 vaxor（vaxor_2550）。
# 同总线 ID 必须唯一：固件注册表以 motor_id 为键（= 厂家 node 号，重号即 CONFIG_CONFLICT），
# 固件 HIL 模拟器 fdcan_motor_sim.py 的 --joint-map 同样以裸 ID 为键。
#
# ⚠ 本模型有 18 个关节，只有**第一条链**（joint_link1..9）接电机；第二条链
# （joint_link1.1..9.9）没有电机名/ID（同一台电机不能同时驱动两个关节），在 Gazebo 里
# 其重力被关掉，避免无驱动自由下垂。这套映射沿用被删除的 chest_upper_00 的配置 ——
# 两者是同一上身装配体的不同 CAD 导出，第一条链的关节名与顺序完全相同。
#
# motor_specs_file 指向权威型号库（相对本文件所在目录）。
#
# 本文件不写 timing：仿真侧时序默认继承权威 motor_driver.yaml（simulation.launch.py 的
# 默认值 feedback_timeout_s 0.10 / initial_feedback_wait_s 1.0 与它一致），本模型只在
# simulation_topology.yaml 的 driver_timing 里覆盖要改的那一项（feedback_timeout_s 0.5）。
# 在这里抄一份时序只会让权威值改了它不跟。
motor_hardware:
  motor_specs_file: ../../../../motor_hardware_interface/config/motor.yaml

  buses:
    chest:
      transport: serial_slcan
      tty: /dev/ttyACM0

  motors:
    chest_joint1:
      joint: joint_link1
      bus: chest
      type: cerb_r58_101
      id: 1
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint2:
      joint: joint_link2
      bus: chest
      type: cerb_r58_101
      id: 2
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint3:
      joint: joint_link3
      bus: chest
      type: cerb_r58_101
      id: 3
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint4:
      joint: joint_link4
      bus: chest
      type: cerb_r58_101
      id: 4
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint5:
      joint: joint_link5
      bus: chest
      type: cerb_r58_101
      id: 5
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint6:
      joint: joint_link6
      bus: chest
      type: cerb_r58_101
      id: 6
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint7:
      joint: joint_link7
      bus: chest
      type: cerb_r58_101
      id: 7
      command: {kp: 30.0, kd: 1.0}
      parameters: {mit_position_limit_rad: 12.5, mit_velocity_limit_rad_s: 30.0, mit_torque_limit_nm: 45.0}
    chest_joint8:
      joint: joint_link8
      bus: chest
      type: vaxor_2550
      id: 8
      command: {kp: 0.008, kd: 1.0}
    chest_joint9:
      joint: joint_link9
      bus: chest
      type: vaxor_2550
      id: 9
      command: {kp: 0.008, kd: 1.0}
