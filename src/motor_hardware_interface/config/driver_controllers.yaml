# 真机与 /driver 回环共用同一套 position 控制器配置，区别只有命名空间：
# - 真机：ros2_control_node 在根命名空间运行 → 匹配 controller_manager 键；
# - 回环：ros2_control_node 在 /driver 命名空间运行 → 匹配 /driver/* 键。
# joints 列表不在这里维护：由 launch 从 motor_canfd.yaml 的 motors 顺序生成
# 并注入（单一来源），避免"关节顺序多处副本"漂移。
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    position_controller:
      type: forward_command_controller/ForwardCommandController

/driver/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    position_controller:
      type: forward_command_controller/ForwardCommandController

position_controller:
  ros__parameters:
    interface_name: position

/driver/position_controller:
  ros__parameters:
    interface_name: position
