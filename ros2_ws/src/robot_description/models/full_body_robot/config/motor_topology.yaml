# 每组的两台电机共同控制两个关节，列表顺序只用于标识矩阵的输入和输出。
differential_groups:
  waist:
    motor_numbers: [2, 3]
    joints: [BN_Spine_axis_1, BN_Spine_axis_2]
    # CAD 零位几何参考。两台法兰都按 BN_Spine_yaw_link 的 +X 右手定则计角。
    # 同向主要驱动 axis_1，关节角约为两台同向法兰角的 -1.24 倍。
    # 反向主要驱动 axis_2，+X 侧正转、-X 侧等量负转时，关节角约为 +X 侧角度的 -1.00 倍（中心距 100 mm）。
    # 2、3 号的安装侧和编码器正方向确认后，再填写控制用比例和方向。
    ratio: null
    direction: null
  hips:
    motor_numbers: [4, 5]
    joints: [BN_Hips_axis_1, BN_Hips_axis_2]
    ratio: null
    direction: null
  left_shoulder:
    motor_numbers: [6, 7]
    joints: [BN_LeftShoulder_axis_1, BN_LeftShoulder_axis_2]
    ratio: null
    direction: null
  left_wrist:
    motor_numbers: [13, 14]
    joints: [BN_LeftHand_axis_1, BN_LeftHand_axis_2]
    ratio: null
    direction: null
  right_shoulder:
    motor_numbers: [15, 16]
    joints: [BN_RightShoulder_axis_1, BN_RightShoulder_axis_2]
    ratio: null
    direction: null
  right_wrist:
    motor_numbers: [22, 23]
    joints: [BN_RightHand_axis_1, BN_RightHand_axis_2]
    ratio: null
    direction: null
